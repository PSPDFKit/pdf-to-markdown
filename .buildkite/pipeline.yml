# Loaded by the Buildkite-stored bootstrap after checking the release commit.
env:
  BUILDKITE_CLEAN_CHECKOUT: "true"
steps:
  - label: "Validate and pack npm release"
    key: prepare-npm
    agents:
      queue: default
      linux: true
      docker: true
    command: "bash ci/npm-release.sh prepare"
    timeout_in_minutes: 20
    artifact_paths:
      - ".release-build/*.tgz"
      - ".release-build/manifest.json"
      - ".release-build/summary.md"

  - label: "Publish, verify, and tag npm release"
    key: publish-npm
    depends_on: prepare-npm
    agents:
      queue: default
      linux: true
      docker: true
    command: "bash ci/npm-release.sh publish"
    concurrency: 1
    concurrency_group: "pdf-to-markdown/npm-publish"
    timeout_in_minutes: 10
