# Register this as a manual-only pipeline; see docs/releasing.md.
steps:
  - label: "Validate and pack npm release"
    key: prepare-npm
    if: build.branch == "main" && build.pull_request.id == null && (build.source == "ui" || build.source == "api")
    agents:
      queue: default
      linux: true
      docker: true
    command: "bash ci/npm-release.sh prepare"
    timeout_in_minutes: 20
    artifact_paths:
      - ".release-build/*.tgz"
      - ".release-build/manifest.json"
      - ".release-build/summary.md"

  - block: "Publish tested package to npm"
    key: approve-npm
    depends_on: prepare-npm
    if: build.branch == "main" && build.pull_request.id == null && (build.source == "ui" || build.source == "api")
    prompt: "Review the version, commit, and integrity in the release summary before approving publication to the public npm registry."

  - label: "Publish, verify, and tag npm release"
    key: publish-npm
    depends_on:
      - prepare-npm
      - approve-npm
    if: build.branch == "main" && build.pull_request.id == null && (build.source == "ui" || build.source == "api")
    agents:
      queue: default
      linux: true
      docker: true
    command: "bash ci/npm-release.sh publish"
    concurrency: 1
    concurrency_group: "pdf-to-markdown/npm-publish"
    timeout_in_minutes: 10
