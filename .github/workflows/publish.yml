name: Publish npm package

on:
  workflow_dispatch:

permissions:
  contents: read

# Do not interrupt a publication when someone starts another release.
concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - name: Test and pack
        run: node ci/release.mjs prepare
      - name: Smoke test the tarball without checkout or credentials
        run: |
          tarball="$(node -p "require('./.release-build/manifest.json').filename")"
          docker run --rm \
            --volume "$PWD/ci/smoke.mjs:/smoke.mjs:ro" \
            --volume "$PWD/.release-build/$tarball:/package.tgz:ro" \
            node:24.14.1-trixie@sha256:e4ceb04a1f1dd4823a1ab6ef8d2182c09d6299b507c70f20bd0eb9921a78354d \
            node /smoke.mjs /package.tgz
      - name: Release summary
        run: cat .release-build/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package
          path: |
            .release-build/*.tgz
            .release-build/manifest.json
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
          retention-days: 30

  publish:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Configure this environment to allow deployments from main only.
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: .release-build
      - name: Publish with npm OIDC and tag the release
        run: node ci/release.mjs publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
